# Docker Compose生产环境配置(使用自定义端口)
# 适用于端口80和8000已被占用的情况
# 使用端口: 8001(前端), 8002(后端)

version: '3.8'

services:
  # PostgreSQL数据库
  postgres:
    image: postgres:16-alpine
    container_name: content-creation-postgres-prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-content_creation}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"  # 仅本地访问
    networks:
      - app-network-prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis缓存和消息队列
  redis:
    image: redis:7-alpine
    container_name: content-creation-redis-prod
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis123}
    volumes:
      - redis_data_prod:/data
    ports:
      - "127.0.0.1:6379:6379"  # 仅本地访问
    networks:
      - app-network-prod
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 后端API服务
  backend:
    build:
      context: ./content-creation-backend
      dockerfile: Dockerfile
    image: content-creation-backend-prod
    container_name: content-creation-backend-prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 应用配置
      APP_NAME: ${APP_NAME:-Content Creation API}
      DEBUG: ${DEBUG:-false}
      PORT: 8000
      # 一键关闭所有 GRSAI 模型（默认开启）。注意：必须传入容器环境变量才会生效
      ENABLE_GRSAI_MODELS: ${ENABLE_GRSAI_MODELS:-true}
      
      # 数据库配置
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-content_creation}
      
      # Redis配置
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      
      # JWT配置
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-change-in-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      
      # CORS配置
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8001","http://47.83.9.28:8001"]}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-["*"]}
      
      # 阿里云OSS配置
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET}
      OSS_BUCKET_NAME: ${OSS_BUCKET_NAME}
      OSS_ENDPOINT: ${OSS_ENDPOINT}
      
      # 大模型API配置
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      DEEP_SEEK: ${DEEP_SEEK}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      QWEN_API_KEY: ${QWEN_API_KEY}
      QWEN_BASE_URL: ${QWEN_BASE_URL}
      
      # 图片生成API配置
      GRSAI_KEY: ${GRSAI_KEY}
      
      # Coze API配置（热点情报功能）
      COZE_API_KEY: ${COZE_API_KEY}
      COZE_AGENT_ID: ${COZE_AGENT_ID}
      COZE_BOT_ID: ${COZE_BOT_ID}
      
      # 火山引擎配置
      VOLC_ACCESS_KEY_ID: ${VOLC_ACCESS_KEY_ID}
      VOLC_SECRET_ACCESS_KEY: ${VOLC_SECRET_ACCESS_KEY}
      VOLC_BASE_URL: ${VOLC_BASE_URL:-https://visual.volcengineapi.com}
      # 火山方舟（Ark）API Key（Seedance/Doubao 视频生成）
      HUOSHAN_API_KEY: ${HUOSHAN_API_KEY}
      VOLC_ARK_BASE_URL: ${VOLC_ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
    volumes:
      - ./content-creation-backend/uploads:/app/uploads
      - ./content-creation-backend/logs:/app/logs
    ports:
      - "8002:8000"  # 映射到8002端口避免冲突
    networks:
      - app-network-prod
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # 前端Web服务
  frontend:
    build:
      context: ./content-creation-frontend
      dockerfile: Dockerfile
    container_name: content-creation-frontend-prod
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # 配置API代理到8002端口
      BACKEND_PORT: 8002
    ports:
      - "8001:80"  # 映射到8001端口避免冲突
    networks:
      - app-network-prod
    volumes:
      - ./nginx-custom.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Celery Worker (异步任务处理)
  celery-worker:
    image: content-creation-backend-prod
    container_name: content-creation-celery-worker-prod
    restart: unless-stopped
    command: celery -A src.tasks.celery_app worker --loglevel=info --concurrency=15
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-content_creation}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis123}@redis:6379/0
      # 一键关闭所有 GRSAI 模型（默认开启）。注意：必须传入容器环境变量才会生效
      ENABLE_GRSAI_MODELS: ${ENABLE_GRSAI_MODELS:-true}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET}
      OSS_BUCKET_NAME: ${OSS_BUCKET_NAME}
      OSS_ENDPOINT: ${OSS_ENDPOINT}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      DEEP_SEEK: ${DEEP_SEEK}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      QWEN_API_KEY: ${QWEN_API_KEY}
      QWEN_BASE_URL: ${QWEN_BASE_URL}
      GRSAI_KEY: ${GRSAI_KEY}
      COZE_API_KEY: ${COZE_API_KEY}
      COZE_AGENT_ID: ${COZE_AGENT_ID}
      COZE_BOT_ID: ${COZE_BOT_ID}
      VOLC_ACCESS_KEY_ID: ${VOLC_ACCESS_KEY_ID}
      VOLC_SECRET_ACCESS_KEY: ${VOLC_SECRET_ACCESS_KEY}
      VOLC_BASE_URL: ${VOLC_BASE_URL:-https://visual.volcengineapi.com}
      HUOSHAN_API_KEY: ${HUOSHAN_API_KEY}
      VOLC_ARK_BASE_URL: ${VOLC_ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
    volumes:
      - ./content-creation-backend/uploads:/app/uploads
      - ./content-creation-backend/logs:/app/logs
    networks:
      - app-network-prod

networks:
  app-network-prod:
    driver: bridge

volumes:
  postgres_data_prod:
    driver: local
  redis_data_prod:
    driver: local

